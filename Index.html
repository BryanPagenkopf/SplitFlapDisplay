<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Split-Flap Display</title>
<style>
/* ===== main.css ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  background-color: #080808;
  color: #f5f5f5;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 2rem;
  overflow: hidden;
}

#board {
  flex: none;
  transform-origin: center center;
}

/* ===== split-flap.css ===== */
:root {
  --flap-h: 72px;
  --flap-w: 48px;
  --flap-bg-top: #2b312d;
  --flap-bg-bottom: #1d2220;
  --flap-text: #f0f0f0;
  --flap-edge: #000;
  --flap-hi: rgba(255, 255, 255, 0.12);
}

.split-flap-board {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 26px;
  background-color: #050505;
  border: 1px solid #1a1a1a;
  border-radius: 14px;
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  width: fit-content;
  max-width: none;
  margin: 0 auto;
}

.flap-row {
  display: flex;
  gap: 6px;
}

.flap-module {
  position: relative;
  width: var(--flap-w);
  height: var(--flap-h);
  perspective: 360px;
  font-family: "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
  font-weight: 700;
  font-size: 46px;
  user-select: none;
}

/* One half of a flap. The glyph is drawn once at full module height; the top
   half shows its upper part and the bottom half its lower part. */
.half {
  position: absolute;
  left: 0;
  width: 100%;
  height: 50%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  color: var(--flap-text);
}

.half span {
  display: block;
  flex: none;
  width: 100%;
  height: var(--flap-h);
  line-height: var(--flap-h);
  text-align: center;
}

.half::after {            /* crisp edge + highlight, drawn over the glyph */
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border: 1px solid var(--flap-edge);
  border-radius: inherit;
  pointer-events: none;
}

.half.top {
  top: 0;
  align-items: flex-start;
  background-color: var(--flap-bg-top);
  background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.07), rgba(0, 0, 0, 0.2));
  border-radius: 6px 6px 0 0;
}
.half.top::after { box-shadow: inset 0 1px 0 var(--flap-hi); }

.half.bottom {
  bottom: 0;
  align-items: flex-end;
  background-color: var(--flap-bg-bottom);
  background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.18), rgba(255, 255, 255, 0.04));
  border-radius: 0 0 6px 6px;
}
.half.bottom::after { box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.07); }

/* Centre hinge with side pins */
.hinge {
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  height: 2px;
  margin-top: -1px;
  background: #000;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07);
  z-index: 1;
  pointer-events: none;
}
.hinge::before,
.hinge::after {
  content: '';
  position: absolute;
  top: -3px;
  width: 4px;
  height: 8px;
  background: #0b0b0b;
  border-radius: 2px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
.hinge::before { left: -1px; }
.hinge::after { right: -1px; }

/* Moving flaps */
.flip { visibility: hidden; z-index: 2; }
.flip.front { transform-origin: center bottom; }
.flip.back { transform-origin: center top; z-index: 3; }
.shade {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
}

.theme-solari {
  --flap-bg-top: #2b312d;
  --flap-bg-bottom: #1d2220;
  --flap-text: #ffcf70;
}

.theme-neon {
  --flap-bg-top:#16223a;--flap-bg-bottom:#0d1627;--flap-text:#38bdf8;--flap-hi:rgba(120,190,255,.16);
}
.theme-thanksgiving{--flap-bg-top:#6f2f18;--flap-bg-bottom:#3f1b10;--flap-text:#f6c66b;--flap-hi:rgba(255,211,132,.18)}
.theme-christmas{--flap-bg-top:#174f32;--flap-bg-bottom:#0b2d1c;--flap-text:#f5e7c8;--flap-hi:rgba(255,255,255,.18)}

/* ===== control-drawer.css ===== */
#gear {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid #333;
  background: #151515;
  color: #ccc;
  font-size: 20px;
  cursor: pointer;
  opacity: 0.2;
  transition: opacity 0.2s;
  z-index: 20;
}
#gear:hover,
body.drawer-open #gear { opacity: 1; }

#drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: 340px;
  max-width: 100%;
  background: #111;
  border-left: 1px solid #2a2a2a;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  z-index: 10;
  padding: 20px 20px 40px;
  overflow-y: auto;
  font-size: 14px;
}
body.drawer-open #drawer { transform: none; }

#drawer h2 { font-size: 18px; margin: 4px 40px 16px 0; }
#drawer h3 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #888; margin: 22px 0 10px; }
#drawer label { display: block; margin-bottom: 12px; color: #bbb; }
#drawer input[type="text"],
#drawer input[type="url"],
#drawer input[type="number"],
#drawer select,
#drawer textarea {
  display: block;
  width: 100%;
  margin-top: 4px;
  padding: 8px;
  background: #1b1b1b;
  color: #f0f0f0;
  border: 1px solid #333;
  border-radius: 6px;
  font: inherit;
}
#drawer textarea { font-family: 'Courier New', Courier, monospace; resize: vertical; text-transform: uppercase; }
#drawer .row { display: flex; gap: 10px; }
#drawer .row label { flex: 1; }
#drawer .check { display: flex; align-items: center; gap: 8px; }
#drawer .check input { width: auto; margin: 0; }
#drawer .hint { font-size: 12px; color: #777; margin: -6px 0 12px; }
#drawer button.action {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid #444;
  background: #222;
  color: #eee;
  font: inherit;
  cursor: pointer;
}
#drawer button.primary { background: #ffcf70; color: #111; border-color: #ffcf70; font-weight: 700; }
#drawer button.action:hover { filter: brightness(1.15); }
#drawer [hidden] { display: none; }
body.managed #gear, body.managed #drawer { display: none; }
</style>
</head>
<body>
<div id="app"><div id="board"></div></div>

<script>
/* ===== SoundManager.js ===== */
class SoundManager {
  constructor(enabled = true) {
    this.enabled = enabled;
    this.audioCtx = null;
  }

  init() {
    if (!this.audioCtx && typeof window !== 'undefined') {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.audioCtx = new AudioContext();
      }
    }
  }

  playClick(pitchVariance = 0.1) {
    if (!this.enabled) return;
    this.init();

    if (!this.audioCtx) return;
    if (this.audioCtx.state === 'suspended') {
      this.audioCtx.resume();
    }

    try {
      const bufferSize = Math.floor(this.audioCtx.sampleRate * 0.03);
      const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = this.audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200 + (Math.random() * 400 - 200) * pitchVariance;
      filter.Q.value = 3;

      const gain = this.audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.03);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.audioCtx.destination);

      noise.start();
    } catch (e) {
      console.warn('Audio playback prevented by browser policy:', e);
    }
  }
}

/* ===== DataAdapter.js ===== */
class DataAdapter {
  constructor(sourceConfig) {
    this.url = sourceConfig.url || '';
    this.method = sourceConfig.method || 'GET';
    this.headers = sourceConfig.headers || {};
  }

  async fetchData() {
    if (!this.url) {
      return this.getMockData();
    }

    try {
      const response = await fetch(this.url, {
        method: this.method,
        headers: {
          'Cache-Control': 'no-cache',
          ...this.headers
        }
      });

      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const contentType = response.headers.get('content-type');
      if (contentType && contentType.includes('application/json')) {
        const json = await response.json();
        return this.normalizeJson(json);
      } else {
        const text = await response.text();
        return this.normalizeText(text);
      }
    } catch (error) {
      console.error('DataAdapter fetch error:', error);
      return null;
    }
  }

  normalizeJson(data) {
    if (Array.isArray(data)) {
      return data.map(String);
    }
    if (data.lines && Array.isArray(data.lines)) {
      return data.lines.map(String);
    }
    if (data.data && Array.isArray(data.data)) {
      return data.data.map(String);
    }
    return [JSON.stringify(data)];
  }

  normalizeText(text) {
    return text.split('\n').filter(line => line.trim().length > 0);
  }

  getMockData() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const tzName = (new Intl.DateTimeFormat([], { timeZoneName: 'short' }).formatToParts(now).find(p => p.type === 'timeZoneName') || {}).value || '';
    return [
      `SCREENCLOUD LIVE v1.0`,
      `TIME: ${timeStr} ${tzName}`,
      `STATUS: ALL SYSTEMS NOMINAL`,
      `DEST: KIOSK DISPLAY 01`,
      `POLL INTERVAL: 30 SECONDS`
    ];
  }
}

/* ===== Board.js ===== */
const DRUM = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.-/,!?&'%()+";
const DIGITS = '0123456789';
const MAX_STEPS = 10;     // longest run of flaps shown for one change
const FLIP_MS = 110;      // duration of the falling half of a flap turn (landing takes 1.5x)

class Board {
  constructor(containerElement, options = {}) {
    this.container = containerElement;
    this.rows = options.rows || 5;
    this.cols = options.cols || 24;
    this.theme = options.theme || 'solari';
    this.soundManager = options.soundManager;
    this.currentState = [];
    this.lastClick = 0;
    this.init();
  }

  init() {
    this.container.innerHTML = '';
    this.container.className = `split-flap-board theme-${this.theme}`;

    this.currentState = Array(this.rows).fill('').map(() => ' '.repeat(this.cols));

    this.gridElement = document.createElement('div');
    this.gridElement.className = 'flap-grid';
    this.container.appendChild(this.gridElement);

    this.renderInitialGrid();
  }

  renderInitialGrid() {
    this.gridElement.innerHTML = '';
    for (let r = 0; r < this.rows; r++) {
      const rowEl = document.createElement('div');
      rowEl.className = 'flap-row';
      rowEl.dataset.row = r;

      for (let c = 0; c < this.cols; c++) {
        const moduleEl = document.createElement('div');
        moduleEl.className = 'flap-module';
        moduleEl.innerHTML = `
          <div class="half top"><span> </span><i class="shade"></i></div>
          <div class="half bottom"><span> </span><i class="shade"></i></div>
          <div class="hinge"></div>
          <div class="half top flip front"><span> </span><i class="shade"></i></div>
          <div class="half bottom flip back"><span> </span><i class="shade"></i></div>
        `;
        const k = moduleEl.children;
        moduleEl._m = {
          char: ' ', target: ' ', busy: false,
          topNew: k[0].firstElementChild, topShade: k[0].lastElementChild,         // static top half (shows the new character)
          bottomOld: k[1].firstElementChild, bottomShade: k[1].lastElementChild,   // static bottom half (old character until the flap lands)
          front: k[3], frontCh: k[3].firstElementChild, frontShade: k[3].lastElementChild,
          back: k[4], backCh: k[4].firstElementChild, backShade: k[4].lastElementChild
        };
        rowEl.appendChild(moduleEl);
      }
      this.gridElement.appendChild(rowEl);
    }
  }

  updateText(newLines,cellColors) {
    for(let r=0;r<this.rows;r++){const rawLine=newLines[r]||'',paddedLine=rawLine.padEnd(this.cols,' ').substring(0,this.cols).toUpperCase();this.updateRow(r,paddedLine);const row=this.gridElement.children[r];if(row)for(let c=0;c<this.cols;c++){const m=row.children[c],color=cellColors&&cellColors[r]&&cellColors[r][c],custom=/^#[0-9a-f]{6}$/i.test(color||''),hasChar=paddedLine[c]!==' ';m.style.setProperty('--flap-text',custom&&hasChar?color:'');m.style.setProperty('--flap-bg-top',custom&&!hasChar?color:'');m.style.setProperty('--flap-bg-bottom',custom&&!hasChar?color:'')}}
  }

  updateRow(rowIndex, newLine) {
    const rowEl = this.gridElement.children[rowIndex];
    if (!rowEl) return;

    const currentLine = this.currentState[rowIndex] || ' '.repeat(this.cols);

    for (let c = 0; c < this.cols; c++) {
      const targetChar = newLine[c];
      const currentChar = currentLine[c];

      if (targetChar !== currentChar) {
        const moduleEl = rowEl.children[c];
        setTimeout(() => {
          this.animateCharacter(moduleEl, targetChar);
        }, c * 25 + Math.random() * 60);
      }
    }

    this.currentState[rowIndex] = newLine;
  }

  animateCharacter(moduleEl, targetChar) {
    const m = moduleEl._m;
    if (!m) return;
    m.target = targetChar;
    if (!m.busy) this.run(m);
  }

  /* Cycle forward through the drum until the target character is showing */
  async run(m) {
    m.busy = true;
    try {
      while (m.char !== m.target) {
        const goal = m.target;
        const path = this.path(m.char, goal);
        for (const c of path) {
          await this.flipStep(m, c);
          m.char = c;
          if (m.target !== goal) break;
        }
      }
    } finally {
      m.busy = false;
    }
  }

  path(from, to) {
    const drum = (DIGITS.includes(from) && DIGITS.includes(to)) ? DIGITS : DRUM;
    const a = drum.indexOf(from);
    const b = drum.indexOf(to);
    if (a < 0 || b < 0) return [to];
    const out = [];
    let i = a;
    while (i !== b) {
      i = (i + 1) % drum.length;
      out.push(drum[i]);
    }
    return out.length > MAX_STEPS ? out.slice(-MAX_STEPS) : out;
  }

  click() {
    if (!this.soundManager) return;
    const now = performance.now();
    if (now - this.lastClick > 35) {
      this.lastClick = now;
      this.soundManager.playClick();
    }
  }

  /* One flap turn: the top flap falls forward revealing the next character,
     then the matching bottom flap swings down, lands and settles with a small rebound. */
  flipStep(m, next) {
    m.topNew.textContent = next;
    if (typeof m.front.animate !== 'function') {   // very old browsers: no animation
      m.frontCh.textContent = next;
      m.bottomOld.textContent = next;
      return Promise.resolve();
    }

    m.frontCh.textContent = m.char;
    m.backCh.textContent = next;
    m.front.style.visibility = 'visible';
    this.click();

    const o = (ms, easing) => ({ duration: ms, easing: easing, fill: 'forwards' });
    const fall = [
      m.front.animate([{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(-90deg)' }], o(FLIP_MS, 'ease-in')),
      m.frontShade.animate([{ opacity: 0 }, { opacity: 0.8 }], o(FLIP_MS, 'ease-in')),
      m.topShade.animate([{ opacity: 0.6 }, { opacity: 0 }], o(FLIP_MS, 'ease-in')),
      m.bottomShade.animate([{ opacity: 0 }, { opacity: 0.5 }], o(FLIP_MS, 'ease-in'))
    ];

    return fall[0].finished.then(() => {
      m.front.style.visibility = 'hidden';
      m.back.style.visibility = 'visible';
      fall.forEach(x => x.cancel());
      const land = FLIP_MS * 1.5;
      const rise = [
        m.back.animate([
          { transform: 'rotateX(90deg)', offset: 0, easing: 'ease-out' },
          { transform: 'rotateX(0deg)', offset: 0.7, easing: 'ease-in-out' },
          { transform: 'rotateX(4deg)', offset: 0.85, easing: 'ease-in-out' },
          { transform: 'rotateX(0deg)', offset: 1 }
        ], { duration: land, fill: 'forwards' }),
        m.backShade.animate([{ opacity: 0.8 }, { opacity: 0 }], o(land * 0.7, 'ease-out')),
        m.bottomShade.animate([{ opacity: 0.5 }, { opacity: 0 }], o(land * 0.7, 'ease-out'))
      ];
      return rise[0].finished.then(() => rise.forEach(x => x.cancel()));
    }).then(() => {
      m.bottomOld.textContent = next;
      m.back.style.visibility = 'hidden';
    });
  }
}

/* ===== config.js (settings state, localStorage, URL params) ===== */
const STORAGE_KEY = 'splitflap.config.v1';

const DEFAULTS = {
  mode: 'sim',               // 'sim' | 'manual' | 'source'
  manualText: 'HELLO\nSPLIT-FLAP DISPLAY',
  source: '',
  rows: 6,
  cols: 28,
  theme: 'solari',
  interval: 30,              // seconds
  sound: true,
  controls: true
};

function loadConfig() {
  let saved = {};
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};
  } catch (e) { /* storage unavailable: use defaults */ }

  const cfg = { ...DEFAULTS, ...saved };

  // URL parameters win over saved settings (kiosk / ScreenCloud use)
  const p = new URLSearchParams(window.location.search);
  if (p.get('rows')) cfg.rows = parseInt(p.get('rows'), 10) || cfg.rows;
  if (p.get('cols')) cfg.cols = parseInt(p.get('cols'), 10) || cfg.cols;
  if (p.get('interval')) cfg.interval = parseInt(p.get('interval'), 10) || cfg.interval;
  if (p.get('theme')) cfg.theme = p.get('theme');
  if (p.get('sound')) cfg.sound = p.get('sound') !== 'false';
  if (p.get('controls')) cfg.controls = p.get('controls') !== 'false';
  if (p.get('source')) { cfg.source = p.get('source'); cfg.mode = 'source'; }
  if (p.get('lines')) { cfg.manualText = p.get('lines').split('|').join('\n'); cfg.mode = 'manual'; }

  return sanitizeConfig(cfg);
}

function sanitizeConfig(cfg) {
  const clamp = (v, lo, hi, fallback) => {
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : fallback;
  };
  cfg.rows = clamp(cfg.rows, 1, 20, DEFAULTS.rows);
  cfg.cols = clamp(cfg.cols, 1, 60, DEFAULTS.cols);
  cfg.interval = clamp(cfg.interval, 1, 86400, DEFAULTS.interval);
  if (!['sim', 'manual', 'source'].includes(cfg.mode)) cfg.mode = 'sim';
  if (!['solari','neon','thanksgiving','christmas'].includes(cfg.theme)) cfg.theme = 'solari';
  cfg.sound = !!cfg.sound;
  return cfg;
}

function saveConfig(cfg) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  } catch (e) { /* storage unavailable: settings last for this session only */ }
}

function buildKioskUrl(cfg) {
  const base = window.location.href.split('?')[0].split('#')[0];
  const p = new URLSearchParams();
  p.set('rows', cfg.rows);
  p.set('cols', cfg.cols);
  p.set('theme', cfg.theme);
  p.set('interval', cfg.interval);
  if (!cfg.sound) p.set('sound', 'false');
  if (cfg.mode === 'manual') p.set('lines', cfg.manualText.split('\n').join('|'));
  if (cfg.mode === 'source' && cfg.source) p.set('source', cfg.source);
  p.set('controls', 'false');
  return base + '?' + p.toString();
}

/* ===== ControlDrawer.js ===== */
class ControlDrawer {
  constructor(config, onApply) {
    this.onApply = onApply;
    this.config = config;
    this.build();
    this.fill(config);

    document.addEventListener('keydown', (e) => {
      const typing = /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''));
      if (e.key === 'Escape') this.toggle(false);
      if ((e.key === 'c' || e.key === 'C') && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
        this.toggle();
      }
    });
  }

  build() {
    this.gear = document.createElement('button');
    this.gear.id = 'gear';
    this.gear.title = 'Display controls (C)';
    this.gear.textContent = '\u2699';
    this.gear.addEventListener('click', () => this.toggle());
    document.body.appendChild(this.gear);

    this.el = document.createElement('aside');
    this.el.id = 'drawer';
    this.el.innerHTML = `
      <h2>Display Controls</h2>

      <label>Content
        <select id="cc-mode">
          <option value="sim">Simulation feed</option>
          <option value="manual">Manual text</option>
          <option value="source">Data source URL</option>
        </select>
      </label>

      <div id="cc-manual">
        <label>Lines (one per row)
          <textarea id="cc-text" rows="8" spellcheck="false"></textarea>
        </label>
        <div class="hint" id="cc-hint"></div>
      </div>

      <div id="cc-source-wrap">
        <label>Source URL
          <input id="cc-source" type="url" placeholder="https://example.com/data.json" />
        </label>
        <div class="hint">JSON array, {"lines": []}, {"data": []}, or plain text with one line per row.</div>
      </div>

      <h3>Board</h3>
      <div class="row">
        <label>Rows <input id="cc-rows" type="number" min="1" max="20" /></label>
        <label>Columns <input id="cc-cols" type="number" min="1" max="60" /></label>
      </div>
      <div class="row">
        <label>Theme
          <select id="cc-theme">
            <option value="solari">Solari (amber)</option>
            <option value="neon">Neon (blue)</option><option value="thanksgiving">Thanksgiving</option><option value="christmas">Christmas</option>
          </select>
        </label>
        <label>Refresh (sec) <input id="cc-interval" type="number" min="1" /></label>
      </div>
      <label class="check"><input id="cc-sound" type="checkbox" /> Click sounds</label>

      <button class="action primary" id="cc-apply">Update Display</button>

      <h3>Kiosk / ScreenCloud link</h3>
      <div class="hint">Builds a URL with these settings baked in and the controls hidden.</div>
      <input id="cc-url" type="text" readonly />
      <button class="action" id="cc-copy">Copy kiosk URL</button>
      <div class="hint" style="margin-top:14px">Press C to open or close this panel. Esc closes it.</div>
    `;
    document.body.appendChild(this.el);

    const $ = (id) => this.el.querySelector('#' + id);
    this.f = {
      mode: $('cc-mode'), text: $('cc-text'), source: $('cc-source'),
      rows: $('cc-rows'), cols: $('cc-cols'), theme: $('cc-theme'),
      interval: $('cc-interval'), sound: $('cc-sound'),
      manual: $('cc-manual'), sourceWrap: $('cc-source-wrap'),
      hint: $('cc-hint'), url: $('cc-url')
    };

    this.f.mode.addEventListener('change', () => this.refreshVisibility());
    this.f.rows.addEventListener('input', () => this.refreshHint());
    this.f.cols.addEventListener('input', () => this.refreshHint());
    $('cc-apply').addEventListener('click', () => this.apply());
    $('cc-copy').addEventListener('click', () => this.copyUrl());
  }

  fill(cfg) {
    this.f.mode.value = cfg.mode;
    this.f.text.value = cfg.manualText;
    this.f.source.value = cfg.source;
    this.f.rows.value = cfg.rows;
    this.f.cols.value = cfg.cols;
    this.f.theme.value = cfg.theme;
    this.f.interval.value = cfg.interval;
    this.f.sound.checked = cfg.sound;
    this.refreshVisibility();
  }

  read() {
    return sanitizeConfig({
      ...this.config,
      mode: this.f.mode.value,
      manualText: this.f.text.value,
      source: this.f.source.value.trim(),
      rows: this.f.rows.value,
      cols: this.f.cols.value,
      theme: this.f.theme.value,
      interval: this.f.interval.value,
      sound: this.f.sound.checked
    });
  }

  refreshVisibility() {
    const mode = this.f.mode.value;
    this.f.manual.hidden = mode !== 'manual';
    this.f.sourceWrap.hidden = mode !== 'source';
    this.refreshHint();
  }

  refreshHint() {
    const rows = parseInt(this.f.rows.value, 10) || this.config.rows;
    const cols = parseInt(this.f.cols.value, 10) || this.config.cols;
    this.f.hint.textContent = `Board is ${cols} characters wide by ${rows} rows. Longer lines are cut off.`;
  }

  apply() {
    this.config = this.read();
    this.f.url.value = buildKioskUrl(this.config);
    this.onApply(this.config);
  }

  copyUrl() {
    const url = buildKioskUrl(this.read());
    this.f.url.value = url;
    this.f.url.select();
    const done = () => { this.f.url.blur(); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, () => { document.execCommand('copy'); done(); });
    } else {
      document.execCommand('copy');
      done();
    }
  }

  toggle(force) {
    const open = typeof force === 'boolean' ? force : !document.body.classList.contains('drawer-open');
    document.body.classList.toggle('drawer-open', open);
    if (open) this.f.url.value = buildKioskUrl(this.read());
  }
}

/* ===== main.js ===== */
async function bootstrap() {
  let config = loadConfig();

  const boardEl = document.getElementById('board');
  const soundManager = new SoundManager(config.sound);
  let board = null;
  let adapter = null;
  let pollTimer = null;
  let pollGen = 0;   // bumped on every restart so stale in-flight polls are ignored

  /* ---- Managed mode: content/colors/refresh controlled by controller.html ---- */
  let managed = null, slideIdx = 0, remoteUrl = '', lastRemote = '', currentRaw = null;

  function fillTokens(line) {
    if (line.indexOf('{') === -1) return line;
    const tz = managed && managed.timeZone ? managed.timeZone : undefined;
    const now = new Date();
    const fmt = (o) => new Intl.DateTimeFormat('en-US', { timeZone: tz, ...o }).format(now);

    const hasTarget=!!managed&&managed.countdownTarget!==null,targetMs=hasTarget?managed.countdownTarget:now.getTime(),target=new Date(targetMs);let cursor=new Date(now),years=0,months=0;if(hasTarget&&targetMs>now.getTime()){while(true){const n=new Date(cursor);n.setFullYear(n.getFullYear()+1);if(n<=target){years++;cursor=n}else break}while(true){const n=new Date(cursor);n.setMonth(n.getMonth()+1);if(n<=target){months++;cursor=n}else break}}let secs=Math.max(0,Math.floor((targetMs-cursor.getTime())/1000));const cd={years,months,weeks:Math.floor(secs/604800)};secs%=604800;cd.days=Math.floor(secs/86400);secs%=86400;cd.hours=Math.floor(secs/3600);secs%=3600;cd.minutes=Math.floor(secs/60);cd.seconds=secs%60;
    const p2 = (n) => String(n).padStart(2, '0');

    return line.replace(/\{(time24|time|date|tz|countdown|years|months|weeks|days|hours|minutes|seconds)\}/gi, (m, k) => {
      k = k.toLowerCase();
      if (k === 'time') return fmt({ hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
      if (k === 'time24') return fmt({ hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
      if (k === 'date') return fmt({ weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      if (k === 'countdown' || k in cd) {
        if (!hasTarget) return '--';
        if (k === 'days') return String(cd.days);
        if (k === 'countdown') {
          if(targetMs<=now.getTime()&&managed.countdownDone)return managed.countdownDone;const labels={years:'Y',months:'MO',weeks:'W',days:'D',hours:'H',minutes:'M',seconds:'S'},selected=Object.keys(labels).filter(x=>managed.countdownParts[x]);return selected.map(x=>`${['years','months','weeks','days'].includes(x)?cd[x]:p2(cd[x])}${labels[x]}`).join(' ');
        }
        return ['years','months','weeks','days'].includes(k)?String(cd[k]):p2(cd[k]);
      }
      const part = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' }).formatToParts(now).find(p => p.type === 'timeZoneName');
      return part ? part.value : '';
    });
  }
  const MKEY = 'splitflap.managed.v1';

  function validZone(z) {
    if (!z) return '';
    try { new Intl.DateTimeFormat('en-US', { timeZone: z }); return z; } catch (e) { return ''; }
  }

  function alignLine(line, cols, mode) {
    if (mode === 'left') return line;
    const t = line.trim();
    if (t.length >= cols) return t;
    return mode === 'right' ? t.padStart(cols) : ' '.repeat(Math.floor((cols - t.length) / 2)) + t;
  }

  function renderLines(raw) {
    return raw.map(l => alignLine(fillTokens(l), managed.cols, managed.align));
  }

  function normalizeManaged(m) {
    const n = (v, lo, hi, d) => { v = parseInt(v, 10); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
    const slides = (Array.isArray(m.slides) ? m.slides : []).map(s => (Array.isArray(s) ? s : String(s).split('\n')).map(String));
    return {
      rows: n(m.rows, 1, 20, 6), cols: n(m.cols, 1, 60, 28), refresh: n(m.refresh, 2, 86400, 10),
      theme:['solari','neon','thanksgiving','christmas'].includes(m.theme)?m.theme:'solari', sound:!!m.sound,
      textColor:/^#[0-9a-f]{6}$/i.test(m.textColor)?m.textColor:'#ffcf70', cellColors:Array.isArray(m.cellColors)?m.cellColors:[], countdownParts:{years:false,months:false,weeks:false,days:true,hours:true,minutes:true,seconds:true,...(m.countdownParts||{})},
      slides: slides.length ? slides : [['']],
      align: ['left', 'center', 'right'].includes(m.align) ? m.align : 'center',
      countdownTarget: (m.countdownTarget === null || m.countdownTarget === undefined || m.countdownTarget === '' || !isFinite(+m.countdownTarget)) ? null : +m.countdownTarget,
      countdownDone: String(m.countdownDone || ''),
      timeZone: validZone(m.timeZone)
    };
  }

  function applyManaged(raw, persist) {
    const next = normalizeManaged(raw);
    const rebuild = !board || next.rows !== config.rows || next.cols !== config.cols || next.theme !== config.theme;
    managed = next;
    slideIdx = 0;
    if (persist) { try { localStorage.setItem(MKEY, JSON.stringify(managed)); } catch (e) {} }
    config = { ...config, rows: next.rows, cols: next.cols, theme: next.theme, interval: next.refresh, sound: next.sound, mode: 'sim' };
    soundManager.enabled = next.sound;
    document.body.classList.add('managed');
    if (rebuild) buildBoard();
    boardEl.style.setProperty('--flap-text', next.textColor);
    restartPolling();
  }

  function fitBoard() {
    boardEl.style.transform = 'none';
    const w = boardEl.offsetWidth;
    const h = boardEl.offsetHeight;
    if (!w || !h) return;
    const s = Math.min((window.innerWidth - 64) / w, (window.innerHeight - 64) / h, 3);
    boardEl.style.transform = `scale(${s})`;
  }

  function buildBoard() {
    board = new Board(boardEl, {
      rows: config.rows,
      cols: config.cols,
      theme: config.theme,
      soundManager: soundManager
    });
    fitBoard();
  }

  async function pollAndUpdate() {
    const gen = pollGen;
    try {
      let lines;
      if (remoteUrl) {
        try {
          const r = await fetch(remoteUrl + (remoteUrl.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
          const txt = await r.text();
          if (gen !== pollGen) return;
          if (txt !== lastRemote) { lastRemote = txt; applyManaged(JSON.parse(txt), false); return; }
        } catch (e) { console.warn('Config fetch failed:', e); }
      }
      if (managed) {
        const currentSlideIndex=slideIdx++%managed.slides.length; currentRaw=managed.slides[currentSlideIndex];
        lines = renderLines(currentRaw);
      } else if (config.mode === 'manual') {
        lines = config.manualText.split('\n');
      } else {
        lines = await adapter.fetchData();
        if (gen !== pollGen) return;
      }
      if (lines && Array.isArray(lines)) {
        board.updateText(lines, managed ? managed.cellColors[(slideIdx-1+managed.slides.length)%managed.slides.length] : null);
      }
    } catch (error) {
      console.error('Failed to update split-flap board from data source:', error);
    }
  }

  function restartPolling() {
    clearInterval(pollTimer);
    pollGen++;
    adapter = new DataAdapter({
      url: config.mode === 'source' ? config.source : '',
      method: 'GET'
    });
    pollAndUpdate();
    if (config.mode !== 'manual') {
      pollTimer = setInterval(pollAndUpdate, config.interval * 1000);
    }
  }

  function applySettings(next) {
    const rebuild = next.rows !== config.rows || next.cols !== config.cols || next.theme !== config.theme;
    config = next;
    saveConfig(config);
    soundManager.enabled = config.sound;
    if (rebuild) buildBoard();
    restartPolling();
  }

  buildBoard();
  restartPolling();
  window.addEventListener('resize', fitBoard);

  // Keep clock tokens ticking between refreshes
  setInterval(() => {
    if (managed && board && currentRaw && currentRaw.some(l => l.indexOf('{') !== -1)) {
      board.updateText(renderLines(currentRaw),managed.cellColors[(slideIdx-1+managed.slides.length)%managed.slides.length]);
    }
  }, 1000);

  const params = new URLSearchParams(window.location.search);
  const live = params.get('live') === 'true';
  try {
    if (params.get('config')) {
      remoteUrl = params.get('config');
      document.body.classList.add('managed');
      restartPolling();
    } else if (params.get('data')) {
      applyManaged(JSON.parse(decodeURIComponent(escape(atob(params.get('data'))))), false);
    } else if (live) {
      const s = localStorage.getItem(MKEY);
      if (s) applyManaged(JSON.parse(s), false);
    }
  } catch (e) { console.warn('Could not load display config:', e); }
  if (live) {
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'splitflap-config') applyManaged(e.data.config, true);
    });
  }

  if (config.controls) {
    new ControlDrawer(config, applySettings);
  }

  document.addEventListener('click', () => {
    soundManager.init();
  }, { once: true });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootstrap);
} else {
  bootstrap();
}
</script>
